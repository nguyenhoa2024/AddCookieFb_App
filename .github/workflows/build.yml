name: Build & Publish Repo
on:
  push:
    branches: [ main ]
    paths: [ 'Tweak.xm', 'Makefile', 'control', '*.plist', '.github/workflows/build.yml' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
      - name: Build package
        run: |
          set -o pipefail
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - name: Build Sileo repo metadata
        env:
          CMSG: ${{ github.event.head_commit.message }}
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
        run: |
          # Nguon BAT BUOC ky GPG: thieu secret -> fail som, KHONG dung toi repo da ky
          [ -n "$REPO_GPG_PRIVATE_KEY" ] || { echo "::error::Thieu secret REPO_GPG_PRIVATE_KEY (Settings > Secrets > Actions)"; exit 1; }
          sudo apt-get update && sudo apt-get install -y dpkg-dev bzip2 gzip xz-utils
          VER="1.0.${{ github.run_number }}"
          DEB=$(ls packages/*.deb | head -1)
          rm -rf _repack && dpkg-deb -R "$DEB" _repack
          sed -i 's/^Architecture:.*/Architecture: iphoneos-arm64e/' _repack/DEBIAN/control
          sed -i "s/^Version:.*/Version: $VER/" _repack/DEBIAN/control
          dpkg-deb -Zxz -b _repack HoaQn.FBTokenLogin.deb
          rm -rf _repack packages .theos build.log
          printf '## %s — %s\n- %s\n\n' "$VER" "$(date +%F)" "${CMSG:-update}" > CHANGELOG.new
          cat CHANGELOG.md >> CHANGELOG.new 2>/dev/null || true
          mv CHANGELOG.new CHANGELOG.md
          # Chi 1 file Packages (khong nen) de tranh jsDelivr cache-skew giua cac file
          rm -f Packages.bz2 Packages.gz
          dpkg-scanpackages -m . > Packages
          P5=$(md5sum Packages|cut -d' ' -f1); PS=$(sha256sum Packages|cut -d' ' -f1); PZ=$(wc -c <Packages)
          cat > Release <<EOF
          Origin: HoaQn Repo
          Label: HoaQn Repo
          Suite: stable
          Version: 1.0
          Codename: ios
          Architectures: iphoneos-arm64e
          Components: main
          Description: AddCookieFb - login FB app bang token
          MD5Sum:
           $P5 $PZ Packages
          SHA256:
           $PS $PZ Packages
          EOF
          echo '<h1>HoaQn Repo - AddCookieFb</h1>' > index.html
          # ky GPG repo (InRelease clearsign + Release.gpg detached) de apt/Sileo chap nhan
          if [ -n "$REPO_GPG_PRIVATE_KEY" ]; then
            echo "$REPO_GPG_PRIVATE_KEY" | gpg --batch --import
            rm -f Release.gpg InRelease
            gpg --batch --yes --armor --detach-sign -o Release.gpg Release
            gpg --batch --yes --clearsign -o InRelease Release
            echo "signed: $(ls -la Release.gpg InRelease)"
          else
            echo "WARNING: thieu secret REPO_GPG_PRIVATE_KEY -> repo khong duoc ky"
          fi
      - name: Commit repo files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f HoaQn.FBTokenLogin.deb Packages Release Release.gpg InRelease hoaqn.gpg index.html CHANGELOG.md
          git commit -m "CI: build v1.0.${{ github.run_number }}" || echo nothing
          git push origin HEAD:main || true
      - name: Purge jsDelivr
        if: always()
        run: |
          B="https://purge.jsdelivr.net/gh/nguyenhoa2024/AddCookieFb_App@main"
          for f in Release Release.gpg InRelease Packages HoaQn.FBTokenLogin.deb hoaqn.gpg; do curl -s -o /dev/null "$B/$f" || true; done
