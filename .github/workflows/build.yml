name: Build & Publish Repo
on:
  push:
    branches: [ main ]
    paths: [ 'Tweak.xm', 'Makefile', 'control', '*.plist', '.github/workflows/build.yml' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
      - name: Build package
        id: build
        run: |
          set -o pipefail
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee build.log
          echo "--- packages dir ---" | tee -a build.log
          ls -la packages/ 2>&1 | tee -a build.log || true
      - name: Commit build log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build.log || true
          git commit -m "CI: build log (fail)" || true
          git push || true
      - name: Build Sileo repo metadata
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev bzip2
          DEB=$(ls packages/*.deb | head -1)
          cp "$DEB" HoaQn.FBTokenLogin.deb
          dpkg-scanpackages -m . > Packages
          bzip2 -kf Packages
          P5=$(md5sum Packages|cut -d' ' -f1); PS=$(sha256sum Packages|cut -d' ' -f1); PZ=$(wc -c <Packages)
          B5=$(md5sum Packages.bz2|cut -d' ' -f1); BS=$(sha256sum Packages.bz2|cut -d' ' -f1); BZ=$(wc -c <Packages.bz2)
          cat > Release <<EOF
          Origin: HoaQn Repo
          Label: HoaQn Repo
          Suite: stable
          Version: 1.0
          Codename: ios
          Architectures: iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: AddCookieFb - login FB app bang token
          MD5Sum:
           $P5 $PZ Packages
           $B5 $BZ Packages.bz2
          SHA256:
           $PS $PZ Packages
           $BS $BZ Packages.bz2
          EOF
          echo '<h1>HoaQn Repo - AddCookieFb</h1>' > index.html
      - name: Commit repo files
        run: |
          rm -f build.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f HoaQn.FBTokenLogin.deb Packages Packages.bz2 Release index.html
          git commit -m "CI: build .deb + Sileo repo metadata" || { echo "nothing"; exit 0; }
          git push origin HEAD:main