name: Build & Publish Repo
on:
  push:
    branches: [ main ]
    paths:
      - 'Tweak.xm'
      - 'Makefile'
      - 'control'
      - '*.plist'
      - 'fbexport/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # can full history de dem commit tung tweak
      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
      - name: Build packages (ca 2 tweak)
        run: |
          set -o pipefail
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp "$(ls packages/*.deb | head -1)" login.deb
          make -C fbexport clean || true
          make -C fbexport package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp "$(ls fbexport/packages/*.deb | head -1)" export.deb
      - name: Build Sileo repo metadata (version doc lap moi tweak)
        env:
          CMSG: ${{ github.event.head_commit.message }}
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev
          # Version RIENG tung tweak = so commit cham file cua chinh no.
          # Chi tweak nao co commit sua moi tang version; tweak kia giu nguyen.
          # Base 1.1 de luon > 1.0.x cu (tranh bi coi la ha cap).
          LVER="1.1.$(git rev-list --count HEAD -- Tweak.xm Makefile control FBTokenLogin.plist)"
          EVER="1.1.$(git rev-list --count HEAD -- fbexport)"
          echo "LVER=$LVER" >> "$GITHUB_ENV"; echo "EVER=$EVER" >> "$GITHUB_ENV"
          echo "FBTokenLogin=$LVER  FBTokenExport=$EVER"
          repack() {   # $1 deb-nguon  $2 deb-ra  $3 version
            rm -rf _repack
            dpkg-deb -R "$1" _repack
            sed -i 's/^Architecture:.*/Architecture: iphoneos-arm64e/' _repack/DEBIAN/control
            sed -i "s/^Version:.*/Version: $3/" _repack/DEBIAN/control
            dpkg-deb -Zxz -b _repack "$2"
            rm -rf _repack
          }
          repack login.deb  HoaQn.FBTokenLogin.deb  "$LVER"
          repack export.deb HoaQn.FBTokenExport.deb "$EVER"
          rm -rf packages fbexport/packages .theos fbexport/.theos build.log login.deb export.deb
          printf '## %s — FBTokenLogin %s / FBTokenExport %s\n- %s\n\n' "$(date +%F)" "$LVER" "$EVER" "${CMSG:-update}" > CHANGELOG.new
          cat CHANGELOG.md >> CHANGELOG.new 2>/dev/null || true
          mv CHANGELOG.new CHANGELOG.md
          # Packages + Packages.gz
          dpkg-scanpackages -m . > Packages
          gzip -9 -c Packages > Packages.gz
          # packages_list.txt (kieu dpkg -l, giong deb-ios-15)
          : > packages_list.txt
          for d in HoaQn.FBTokenLogin.deb HoaQn.FBTokenExport.deb; do
            P=$(dpkg-deb -f "$d" Package); V=$(dpkg-deb -f "$d" Version)
            A=$(dpkg-deb -f "$d" Architecture); D=$(dpkg-deb -f "$d" Description)
            printf 'ii  %-56s %-25s %s %s\n' "$P" "$V" "$A" "$D" >> packages_list.txt
          done
          # Release (Date + hash ca Packages va Packages.gz)
          P5=$(md5sum Packages|cut -d' ' -f1);    PS=$(sha256sum Packages|cut -d' ' -f1);    PZ=$(wc -c <Packages)
          G5=$(md5sum Packages.gz|cut -d' ' -f1); GS=$(sha256sum Packages.gz|cut -d' ' -f1); GZ=$(wc -c <Packages.gz)
          cat > Release <<EOF
          Origin: HoaQn Repo
          Label: HoaQn Repo
          Suite: stable
          Version: 1.0
          Codename: ios
          Architectures: iphoneos-arm64e
          Components: main
          Description: AddCookieFb - FBTokenLogin + FBTokenExport
          Date: $(date -R)
          MD5Sum:
           $P5 $PZ Packages
           $G5 $GZ Packages.gz
          SHA256:
           $PS $PZ Packages
           $GS $GZ Packages.gz
          EOF
          echo '<h1>HoaQn Repo - AddCookieFb</h1>' > index.html
      - name: Commit repo files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f HoaQn.FBTokenLogin.deb HoaQn.FBTokenExport.deb Packages Packages.gz packages_list.txt Release index.html CHANGELOG.md
          git commit -m "CI: FBTokenLogin $LVER, FBTokenExport $EVER" || echo nothing
          git push origin HEAD:main || true
      - name: Purge jsDelivr
        if: always()
        run: |
          B="https://purge.jsdelivr.net/gh/nguyenhoa2024/AddCookieFb_App@main"
          for f in Release Packages Packages.gz HoaQn.FBTokenLogin.deb HoaQn.FBTokenExport.deb; do curl -s -o /dev/null "$B/$f" || true; done
